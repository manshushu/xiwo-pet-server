<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
    <defs>
        <linearGradient id="cloudSky" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fce7f3" />
            <stop offset="45%" stop-color="#fed7aa" />
            <stop offset="100%" stop-color="#fef3c7" />
        </linearGradient>
        <linearGradient id="terraceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="45%" stop-color="#fffbeb" />
            <stop offset="100%" stop-color="#fde68a" />
        </linearGradient>
        <linearGradient id="goldArch" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fde047" />
            <stop offset="50%" stop-color="#f59e0b" />
            <stop offset="100%" stop-color="#d97706" />
        </linearGradient>
    </defs>

    <!-- 晚霞星云天空 -->
    <rect width="1280" height="500" fill="url(#cloudSky)" />

    <!-- 远景柔和发光日轮与浮空星环 -->
    <circle cx="640" cy="240" r="145" fill="#ffffff" opacity="0.55" />
    <ellipse cx="640" cy="240" rx="260" ry="52" transform="rotate(-12 640 240)" fill="none" stroke="#f59e0b" stroke-width="5" stroke-dasharray="18 10" opacity="0.55" />

    <!-- 远景蓬松云朵群 -->
    <g fill="#ffffff" opacity="0.92">
        <circle cx="140" cy="390" r="85" /><circle cx="240" cy="400" r="70" /><circle cx="330" cy="415" r="60" />
        <circle cx="950" cy="410" r="65" /><circle cx="1050" cy="390" r="85" /><circle cx="1160" cy="380" r="95" />
        <circle cx="520" cy="420" r="65" /><circle cx="760" cy="420" r="65" />
    </g>

    <!-- 仙岛金色星门拱廊 (左后与右后) -->
    <path d="M220,440 L220,240 A90,90 0 0,1 400,240 L400,440" fill="none" stroke="url(#goldArch)" stroke-width="14" stroke-linecap="round" />
    <path d="M880,440 L880,240 A90,90 0 0,1 1060,240 L1060,440" fill="none" stroke="url(#goldArch)" stroke-width="14" stroke-linecap="round" />
    <!-- 悬挂星灯 -->
    <line x1="310" y1="150" x2="310" y2="210" stroke="#f59e0b" stroke-width="3" />
    <circle cx="310" cy="222" r="16" fill="#fef08a" stroke="#f59e0b" stroke-width="4" />
    <line x1="970" y1="150" x2="970" y2="210" stroke="#f59e0b" stroke-width="3" />
    <circle cx="970" cy="222" r="16" fill="#fef08a" stroke="#f59e0b" stroke-width="4" />

    <!-- 前景开阔平整的云端玉石露台（供2D宠物漫步） -->
    <path d="M0,445 Q640,420 1280,445 L1280,720 L0,720 Z" fill="url(#terraceGrad)" />
    <path d="M0,450 Q640,425 1280,450" fill="none" stroke="#f59e0b" stroke-width="6" opacity="0.65" />

    <!-- 露台中央星芒阵纹 -->
    <ellipse cx="640" cy="590" rx="310" ry="68" fill="#ffffff" opacity="0.65" stroke="#fcd34d" stroke-width="4" />
    <ellipse cx="640" cy="590" rx="240" ry="50" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="14 8" />

    <!-- 前景两侧软绵云朵围栏 -->
    <g fill="#ffffff" stroke="#fde68a" stroke-width="4">
        <circle cx="60" cy="460" r="42" /><circle cx="130" cy="468" r="34" />
        <circle cx="1150" cy="468" r="34" /><circle cx="1220" cy="460" r="42" />
    </g>
</svg>
