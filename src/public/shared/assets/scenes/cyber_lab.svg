<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
    <defs>
        <linearGradient id="spaceSky" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e1b4b" />
            <stop offset="50%" stop-color="#312e81" />
            <stop offset="100%" stop-color="#4c1d95" />
        </linearGradient>
        <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#e0f2fe" />
            <stop offset="60%" stop-color="#bae6fd" />
            <stop offset="100%" stop-color="#7dd3fc" />
        </linearGradient>
        <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f0f9ff" />
            <stop offset="30%" stop-color="#e0f2fe" />
            <stop offset="100%" stop-color="#bae6fd" />
        </linearGradient>
        <radialGradient id="platformGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
            <stop offset="70%" stop-color="#818cf8" stop-opacity="0.15" />
            <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="planetPink" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#fbcfe8" />
            <stop offset="50%" stop-color="#f472b6" />
            <stop offset="100%" stop-color="#be185d" />
        </radialGradient>
        <radialGradient id="planetCyan" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#cffafe" />
            <stop offset="60%" stop-color="#22d3ee" />
            <stop offset="100%" stop-color="#0e7490" />
        </radialGradient>
    </defs>

    <!-- 太空舱外壳背景墙 -->
    <rect width="1280" height="470" fill="url(#wallGrad)" />

    <!-- 巨型圆角全景星空舷窗 -->
    <rect x="220" y="40" width="840" height="350" rx="64" fill="#0f172a" stroke="#ffffff" stroke-width="14" />
    <rect x="230" y="50" width="820" height="330" rx="54" fill="url(#spaceSky)" />

    <!-- 舷窗内星云与星球 -->
    <circle cx="380" cy="160" r="58" fill="url(#planetPink)" />
    <ellipse cx="380" cy="160" rx="95" ry="20" transform="rotate(-18 380 160)" fill="none" stroke="#fde047" stroke-width="8" opacity="0.8" />
    <circle cx="880" cy="210" r="42" fill="url(#planetCyan)" />
    <circle cx="640" cy="110" r="18" fill="#fde047" opacity="0.9" />
    <!-- 繁星点点 -->
    <g fill="#ffffff" opacity="0.85">
        <circle cx="290" cy="95" r="3" /><circle cx="510" cy="85" r="4" /><circle cx="750" cy="105" r="3" />
        <circle cx="960" cy="115" r="3.5" /><circle cx="480" cy="260" r="2.5" /><circle cx="710" cy="280" r="3.5" />
        <circle cx="310" cy="290" r="2.5" /><circle cx="950" cy="295" r="3" />
    </g>

    <!-- 左侧潮玩全息控制台与胶囊装置 -->
    <rect x="48" y="130" width="130" height="270" rx="28" fill="#ffffff" stroke="#7dd3fc" stroke-width="6" />
    <rect x="66" y="156" width="94" height="90" rx="16" fill="#0284c7" />
    <path d="M78,215 L98,185 L118,205 L144,172" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="90" cy="280" r="14" fill="#f43f5e" /><circle cx="132" cy="280" r="14" fill="#10b981" />
    <rect x="68" y="316" width="90" height="16" rx="8" fill="#bae6fd" />
    <rect x="68" y="344" width="90" height="16" rx="8" fill="#bae6fd" />

    <!-- 右侧潮玩能量补给舱 -->
    <rect x="1102" y="130" width="130" height="270" rx="28" fill="#ffffff" stroke="#7dd3fc" stroke-width="6" />
    <rect x="1122" y="156" width="90" height="140" rx="45" fill="#e0f2fe" stroke="#38bdf8" stroke-width="5" />
    <circle cx="1167" cy="226" r="28" fill="#38bdf8" opacity="0.5" />
    <circle cx="1167" cy="226" r="16" fill="#ffffff" opacity="0.8" />
    <rect x="1126" y="320" width="82" height="46" rx="14" fill="#f59e0b" />

    <!-- 太空舱与地面交界立体踢脚线 -->
    <rect x="0" y="435" width="1280" height="36" fill="#93c5fd" />
    <rect x="0" y="442" width="1280" height="10" fill="#ffffff" opacity="0.7" />

    <!-- 前景开阔平整的潮玩科幻地板（供2D宠物自由漫步） -->
    <rect x="0" y="465" width="1280" height="255" fill="url(#floorGrad)" />
    <!-- 地板透视网格线 -->
    <g stroke="#7dd3fc" stroke-width="3" opacity="0.45">
        <line x1="0" y1="520" x2="1280" y2="520" />
        <line x1="0" y1="585" x2="1280" y2="585" />
        <line x1="0" y1="660" x2="1280" y2="660" />
        <line x1="240" y1="465" x2="80" y2="720" />
        <line x1="460" y1="465" x2="380" y2="720" />
        <line x1="640" y1="465" x2="640" y2="720" />
        <line x1="820" y1="465" x2="900" y2="720" />
        <line x1="1040" y1="465" x2="1200" y2="720" />
    </g>

    <!-- 中央全息投影圆环地垫 -->
    <ellipse cx="640" cy="600" rx="340" ry="72" fill="url(#platformGlow)" />
    <ellipse cx="640" cy="600" rx="280" ry="54" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="24 12" opacity="0.75" />
    <ellipse cx="640" cy="600" rx="210" ry="38" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8" />
</svg>
