<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教师登录 · 西沃智慧宠物</title>
    <style>
        :root {
            --bg-canvas: #FAF6EE;
            --primary: #34B37E;
            --primary-lip: #228B5E;
            --border-soft: #E6DFCE;
            --border-lip: #D5CBB6;
            --ink-main: #2C3531;
            --ink-sub: #68736D;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-canvas);
            background-image:
                radial-gradient(circle at 20% 20%, rgba(52, 179, 126, 0.1) 0%, transparent 45%),
                radial-gradient(#E3DAC6 1.2px, transparent 1.2px);
            background-size: 100% 100%, 24px 24px;
            color: var(--ink-main);
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: #FFFFFF;
            border: 4px solid #FFFFFF;
            border-bottom: 6px solid var(--border-lip);
            border-radius: 28px;
            padding: 36px 32px;
            width: 100%;
            max-width: 390px;
            box-shadow: 0 20px 44px rgba(70, 58, 38, 0.14), 0 0 0 2px var(--border-soft);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #FFE8B6, #FFCA62);
            border: 2px solid #FFFFFF;
            border-bottom: 4px solid #E5A93C;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 14px;
        }
        .title { font-size: 21px; font-weight: 800; margin-bottom: 6px; }
        .desc { font-size: 13px; font-weight: 600; color: var(--ink-sub); margin-bottom: 24px; }
        .form-input {
            width: 100%;
            background: var(--bg-canvas);
            border: 2px solid var(--border-soft);
            border-radius: 14px;
            color: var(--ink-main);
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 700;
            outline: none;
            margin-bottom: 16px;
        }
        .form-input:focus { border-color: var(--primary); background: #FFFFFF; }
        .login-btn {
            width: 100%;
            background: var(--primary);
            border: none;
            border-bottom: 4px solid var(--primary-lip);
            color: #FFFFFF;
            font-weight: 800;
            font-size: 15px;
            padding: 13px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .login-btn:hover { transform: translateY(-2px); }
        .error-msg { color: #DC2626; font-size: 13px; font-weight: 700; margin-bottom: 12px; display: none; }
        .tip { font-size: 12px; font-weight: 600; color: var(--ink-sub); margin-top: 16px; text-align: center; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="icon">🐾</div>
        <h1 class="title">教师机管控大屏登录</h1>
        <p class="desc">默认管理密码为 teacher123</p>

        <div class="error-msg" id="err-box">密码错误</div>

        <form id="t-form" style="width:100%;" onsubmit="handleTeacherLogin(event)">
            <input type="password" class="form-input" id="pwd" placeholder="请输入教师管理密码" required autofocus>
            <button type="submit" class="login-btn" id="btn-login">✨ 进入班级管控大屏</button>
        </form>

        <div class="tip">教师机本机 (localhost) 无需输入密码即可直接进入</div>
    </div>

    <script>
        async function handleTeacherLogin(e) {
            e.preventDefault();
            const password = document.getElementById('pwd').value;
            const errBox = document.getElementById('err-box');
            errBox.style.display = 'none';

            try {
                const res = await fetch('/api/auth/teacher/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = '/teacher/';
                } else {
                    errBox.textContent = data.message || '密码错误';
                    errBox.style.display = 'block';
                }
            } catch (err) {
                errBox.textContent = '网络连接失败';
                errBox.style.display = 'block';
            }
        }
    </script>
</body>
</html>
