<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生登录 · 西沃智慧宠物</title>
    <link rel="stylesheet" href="/shared/css/pet.css">
    <link rel="stylesheet" href="/shared/css/themes.css">
    <style>
        :root {
            --bg-canvas: #FAF6EE;
            --primary: #34B37E;
            --primary-lip: #228B5E;
            --border-soft: #E6DFCE;
            --border-lip: #D5CBB6;
            --ink-main: #2C3531;
            --ink-sub: #68736D;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-canvas);
            background-image:
                radial-gradient(circle at 15% 20%, rgba(52, 179, 126, 0.1) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(255, 159, 46, 0.12) 0%, transparent 45%),
                radial-gradient(#E3DAC6 1.2px, transparent 1.2px);
            background-size: 100% 100%, 100% 100%, 24px 24px;
            color: var(--ink-main);
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: #FFFFFF;
            border: 4px solid #FFFFFF;
            border-bottom: 6px solid var(--border-lip);
            border-radius: 28px;
            padding: 36px 32px;
            width: 100%;
            max-width: 410px;
            box-shadow: 0 20px 44px rgba(70, 58, 38, 0.14), 0 0 0 2px var(--border-soft);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .pet-avatar-stage {
            width: 128px;
            height: 128px;
            margin-bottom: 14px;
            background: radial-gradient(circle, #FFFBEB 0%, #F3EDE0 100%);
            border-radius: 50%;
            border: 3px dashed #E5DEC9;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 6px;
            color: var(--ink-main);
        }
        .login-desc {
            font-size: 13px;
            font-weight: 600;
            color: var(--ink-sub);
            margin-bottom: 24px;
        }
        .form-group {
            width: 100%;
            margin-bottom: 16px;
        }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 800;
            color: var(--ink-main);
            margin-bottom: 6px;
        }
        .form-input {
            width: 100%;
            background: var(--bg-canvas);
            border: 2px solid var(--border-soft);
            border-radius: 14px;
            color: var(--ink-main);
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 700;
            outline: none;
            transition: all 0.2s;
        }
        .form-input:focus {
            border-color: var(--primary);
            background: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(52, 179, 126, 0.15);
        }
        .login-btn {
            width: 100%;
            background: var(--primary);
            border: none;
            border-bottom: 4px solid var(--primary-lip);
            color: #FFFFFF;
            font-weight: 800;
            font-size: 16px;
            padding: 13px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
            box-shadow: 0 6px 18px rgba(52, 179, 126, 0.28);
        }
        .login-btn:hover {
            transform: translateY(-2px);
            background: #2EA371;
        }
        .login-btn:active {
            transform: translateY(1px);
            border-bottom-width: 2px;
        }
        .tip-box {
            margin-top: 20px;
            background: #FFFBEB;
            border: 1.5px solid #FDE68A;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 600;
            color: #92400E;
            text-align: center;
            line-height: 1.6;
            width: 100%;
        }
        .error-msg {
            color: #DC2626;
            font-size: 13px;
            font-weight: 700;
            margin-top: 6px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="pet-avatar-stage" id="login-pet-stage">
            <div class="pet-rig" id="login-pet-rig"></div>
        </div>

        <h1 class="login-title">🐾 智慧宠物</h1>
        <p class="login-desc" id="login-class-badge">正在加载班级...</p>

        <form id="login-form" style="width: 100%;" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label">👤 姓名 / 学号</label>
                <select class="form-input" id="username" required>
                    <option value="">加载中...</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">🔑 密码</label>
                <input type="password" class="form-input" id="password" placeholder="默认 123" value="123" required>
            </div>

            <div class="error-msg" id="login-error">账号或密码有误</div>

            <button type="submit" class="login-btn" id="btn-submit">🐾 进入</button>
        </form>
    </div>

    <script src="/shared/js/skins-catalog.js"></script>
    <script src="/shared/js/pet-renderer.js"></script>
    <script>
        const welcomeSkins = ['starter_fire_fox', 'starter_water_penguin', 'starter_grass_dino'];
        const pickSkin = welcomeSkins[Math.floor(Math.random() * welcomeSkins.length)];
        document.getElementById('login-pet-rig').innerHTML = window.PetRenderer.renderSvg(pickSkin, [], 0, 115, { level: 1 });

        fetch('/api/auth/class-roster').then(r => r.json()).then(data => {
            if (!data.success) return;
            const badge = document.getElementById('login-class-badge');
            if (badge && data.className) badge.textContent = `🏫 ${data.className}`;
            const sel = document.getElementById('username');
            if (sel && Array.isArray(data.students)) {
                sel.innerHTML = data.students.map(s => `<option value="${s.username}">${s.displayName}</option>`).join('');
            }
        }).catch(() => {});

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errEl = document.getElementById('login-error');
            const btn = document.getElementById('btn-submit');

            errEl.style.display = 'none';
            btn.textContent = '正在进入庭院...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/auth/student/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = '/student/app.html';
                } else {
                    errEl.textContent = data.message || '登录失败';
                    errEl.style.display = 'block';
                    btn.textContent = '🐾 进入萌宠庭院';
                    btn.disabled = false;
                }
            } catch (err) {
                errEl.textContent = '网络连接异常，请确认教师端服务已启动';
                errEl.style.display = 'block';
                btn.textContent = '🐾 进入萌宠庭院';
                btn.disabled = false;
            }
        }

        fetch('/api/auth/current').then(r => r.json()).then(data => {
            if (data.loggedIn && data.role === 'student') {
                window.location.href = '/student/app.html';
            }
        }).catch(() => {});
    </script>
</body>
</html>
