  <style>
    * {
      box-sizing: border-box;
      margin: 0;

    body {

      display: flex;
      align-items: center;

      padding: 24px;

      background: #f3f6fb;

    .card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;

      border-radius: 16px;
      padding: 32px 28px;
      text-align: center;

      margin: 0 auto 16px;

      display: flex;

    }
    .desc {

      line-height: 1.7;
      color: #475569;
      margin-bottom: 22px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 13px 20px;
      border-radius: 10px;
      background: #d97706;
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      transition: background 0.15s ease;
    }
    .btn:hover {
      background: #b45309;
    }
    .addr {
      margin-top: 16px;
      font-size: 13px;
      color: #64748b;
      word-break: break-all;
    }
    .addr code {
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 4px;
      color: #334155;
    }
